[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisvox-cfd"
version = "1.1.2"
description = "Adaptive rollback-refinement pseudo-spectral Navier-Stokes solver"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Robert E. Todd Jr. (OmnisVox Research)" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.5", "pyqtgraph>=0.13"]
dev = ["pytest>=7", "httpx>=0.26", "matplotlib>=3.7"]

[project.scripts]
omnisvox-cfd = "omnisvox_cfd.cli:main"

[project.gui-scripts]
omnisvox-cfd-desktop = "omnisvox_desktop.app:main"

[tool.setuptools.packages.find]
include = ["omnisvox_cfd*", "omnisvox_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
